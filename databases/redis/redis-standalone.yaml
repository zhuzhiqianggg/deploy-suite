---
# Redis Exporter - 监控指标导出（与 Redis 同文件，作为 Redis 套件的一部分）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: redis-exporter
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        product: db
        version: lianantech
        branch: hk
        env: release
        app: redis-exporter
        component: monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
      
      - name: registry-secret
      
      containers:
      - name: redis-exporter
        image: docker.io/oliver006/redis_exporter:v1.67.0
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_ADDR
          value: "redis://redis-service.db-lianantech-hk-release.svc.cluster.local:6379"
        - name: REDIS_PASSWORD
          value: "#B7PTagA1B6#*pL@rwJ#"
        ports:
        - name: metrics
          containerPort: 9121
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter-service
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: redis-exporter
    component: monitoring
spec:
  type: ClusterIP
  selector:
    app: redis-exporter
  ports:
  - name: metrics
    port: 9121
    targetPort: metrics
    protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-exporter-monitor
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: redis-exporter
    component: monitoring
    prometheus: kube-prometheus
    release: prometheus-operator
spec:
  selector:
    matchLabels:
      app: redis-exporter
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: false
