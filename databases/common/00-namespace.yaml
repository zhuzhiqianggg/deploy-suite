# =============================================================================
# Kubernetes命名空间模板
# =============================================================================
# 功能说明：
# - 创建应用程序的独立命名空间
# - 提供资源隔离和访问控制边界
# - 统一的标签配置用于资源管理和监控
# =============================================================================
# 必需变量：
#   namespace: 命名空间名称
#   product_name: 产品名称
#   version: 版本号
#   branch: 分支名称
#   environment: 环境标识
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release