# 仓库密钥配置（2026-08-25 起支持多仓库并存）
# registry-secret        ← 默认 SWR 凭据（global-defaults，所有环境一致）
# registry-secret-<key>  ← 附加仓库凭据（infrastructure.registry_extra_secrets.<key>，
#                           如 test 环境 harbor → registry-secret-harbor）
# 用途：测试环境构建推送切内网 Harbor，存量镜像（image_map/数据库公共镜像）仍从
#       SWR 拉取；多 secret 并存，Pod 挂全部 secret，kubelet 按镜像地址自动匹配凭据。
apiVersion: v1
kind: Secret
metadata:
  name: registry-secret
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
type: kubernetes.io/dockerconfigjson
