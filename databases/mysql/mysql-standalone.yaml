---
# MySQL部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-mysql
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: mysql
    type: database
    deployment-mode: internal
  annotations:
    description: "MySQL数据库服务"
    deployment.type: "internal"
    deployment.mode: "standalone"
spec:
  replicas: 1
  strategy:
    type: Recreate  # 单机模式使用Recreate策略确保数据一致性
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        product: db
        version: lianantech
        branch: hk
        env: release
        app: mysql
        type: database
        deployment-mode: internal
      annotations:
        description: "MySQL数据库服务"
    spec:
      serviceAccountName: db-lianantech-hk-release-sa
      imagePullSecrets:
      
      - name: registry-secret
      
      securityContext:
        fsGroup: 999
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: mysql
      # 初始化容器 - 确保数据目录权限正确
      initContainers:
      - name: init-permissions
        image: docker.io/library/busybox:1.38.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          echo "初始化MySQL数据目录权限..."
          mkdir -p /var/lib/mysql /var/log/mysql
          chown -R 999:999 /var/lib/mysql /var/log/mysql
          chmod -R 755 /var/lib/mysql
          echo "权限设置完成"
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
          subPath: mysql/standalone/data
        - name: data
          mountPath: /var/log/mysql
          subPath: mysql/standalone/logs
      containers:
      - name: mysql
        image: docker.io/library/mysql:8.4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3306
          name: mysql
          protocol: TCP
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "zTcKwbKCCRyqAg3vlU2g"
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
          subPath: mysql/standalone/data
        - name: data
          mountPath: /var/log/mysql
          subPath: mysql/standalone/logs
        - name: mysql-config
          mountPath: /etc/mysql/conf.d/my.cnf
          subPath: my.cnf
        resources:
          requests:
            cpu: 500m
            memory: 4Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - -u
            - root
            - -p$(MYSQL_ROOT_PASSWORD)
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - -u
            - root
            - -p$(MYSQL_ROOT_PASSWORD)
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: mysql-config
        configMap:
          name: db-mysql-config
          defaultMode: 0644
      - name: data
        persistentVolumeClaim:
          claimName: db-lianantech-hk-release-pvc
---
# MySQL服务
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: mysql
    type: database-service
    deployment-mode: internal
  annotations:
    description: "MySQL数据库服务"
    deployment.type: "internal"
    service.type: "database"
    databases.count: "9"
    
spec:
  type: ClusterIP
  ports:
  - port: 3306
    targetPort: 3306
    protocol: TCP
    name: mysql
  selector:
    app: mysql
  # 集群内访问地址: mysql-service.db-lianantech-hk-release.svc.cluster.local:3306

---
# MySQL Exporter - 监控指标导出（与 MySQL 同文件，作为 MySQL 套件的一部分）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-exporter
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: mysql-exporter
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-exporter
  template:
    metadata:
      labels:
        product: db
        version: lianantech
        branch: hk
        env: release
        app: mysql-exporter
        component: monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9104"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
      
      - name: registry-secret
      
      containers:
      - name: mysql-exporter
        image: docker.io/prom/mysqld-exporter:v0.15.1
        imagePullPolicy: IfNotPresent
        args:
        - --config.my-cnf=/etc/mysql-exporter/.my.cnf
        ports:
        - name: metrics
          containerPort: 9104
          protocol: TCP
        volumeMounts:
        - name: exporter-config
          mountPath: /etc/mysql-exporter
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: exporter-config
        configMap:
          name: db-mysql-exporter-config
---
# MySQL Exporter 连接配置 (mysqld-exporter v0.15.1 起改用 .my.cnf, 不再支持 DATA_SOURCE_NAME)
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-mysql-exporter-config
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: mysql-exporter
data:
  .my.cnf: |
    [client]
    user=root
    password=zTcKwbKCCRyqAg3vlU2g
    host=mysql-service.db-lianantech-hk-release.svc.cluster.local
    port=3306
    protocol=tcp
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-exporter-service
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: mysql-exporter
    component: monitoring
spec:
  type: ClusterIP
  selector:
    app: mysql-exporter
  ports:
  - name: metrics
    port: 9104
    targetPort: metrics
    protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mysql-exporter-monitor
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: mysql-exporter
    component: monitoring
    prometheus: kube-prometheus
    release: prometheus-operator
spec:
  selector:
    matchLabels:
      app: mysql-exporter
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: false
