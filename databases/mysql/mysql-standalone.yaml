# MySQL内部部署配置 - 单机模式
# 在Kubernetes集群内部署MySQL服务
# 适用于开发、测试环境或需要完全控制的场景
#
# 简化模式：镜像、资源、storage_class、image_pull_secrets 等最佳实践默认值
# 直接写死在本模板里，生成器只传递基础配置（凭据、db_mode、databases 等）。
# 资源规格由 products.db.global.resource_profile 控制：
# - small（测试）：内存 2Gi，buffer_pool 512M / medium（生产默认）：内存 4Gi，buffer_pool 1G
#
# 内存规则（2026-08-25 修订）：内存 request = limit——buffer_pool 常驻内存 + 连接/临时表
# 开销会吃满 limit，request=limit 让调度器按真实占用预留，节点不超卖。
# innodb_buffer_pool_size 按档位派生（≈ limit 的 25%~50%）。
#
# ⚠️ NFS权限要求：
# 如果使用NFS存储，需要确保数据目录有写权限（建议777）：
#   chmod -R 777 /data/nfs/<namespace>/mysql
# 本模板使用root用户运行MySQL以避免NFS权限问题# MySQL配置文件
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-mysql-config
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: mysql
    type: database-config
    deployment-mode: internal
  annotations:
    description: "MySQL数据库服务"
    deployment.type: "internal"
    deployment.mode: "standalone"
data:
  my.cnf: |
    [mysqld]
    # 基础配置
    server-id = 1

    # 字符集配置
    character-set-server = utf8mb4
    collation-server = utf8mb4_unicode_ci

    # 连接配置
    max_connections = 200
    max_connect_errors = 1000
    open_files_limit = 65535
    table_open_cache = 128
    max_allowed_packet = 500M
    binlog_cache_size = 1M
    max_heap_table_size = 8M
    tmp_table_size = 16M

    # InnoDB配置（buffer_pool 按档位派生：small 512M / medium 1G / large 4G）
    innodb_buffer_pool_size = 1G
    innodb_flush_log_at_trx_commit = 2
    innodb_lock_wait_timeout = 50
    innodb_log_buffer_size = 8M
    innodb_log_file_size = 256M
    innodb_max_dirty_pages_pct = 90
    innodb_file_per_table = 1

    # 二进制日志配置
    log-bin = mysql-bin
    binlog_format = ROW
    binlog_expire_logs_seconds = 604800

    # 慢查询日志
    slow_query_log = 1
    slow_query_log_file = /var/log/mysql/mysql-slow.log
    long_query_time = 2

    # 错误日志
    log-error = /var/log/mysql/error.log

    # 安全配置
    skip-name-resolve

    [mysql]
    default-character-set = utf8mb4

    [client]
    default-character-set = utf8mb4

# MySQL使用命名空间共享存储，不需要独立的PVC

