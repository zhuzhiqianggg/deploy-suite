# Elasticsearch Exporter - 监控指标导出（与 ES/Kibana 同文件）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-exporter
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: elasticsearch-exporter
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch-exporter
  template:
    metadata:
      labels:
        product: db
        version: lianantech
        branch: hk
        env: release
        app: elasticsearch-exporter
        component: monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9114"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
      
      - name: registry-secret
      
      containers:
      - name: elasticsearch-exporter
        image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.7.0
        imagePullPolicy: IfNotPresent
        args:
        - "--es.uri=http://elastic:S0CDdiK2lIYixrrAUH7C@elasticsearch-service.db-lianantech-hk-release.svc.cluster.local:9200"
        - "--es.all"
        - "--es.indices"
        - "--es.indices_settings"
        - "--es.shards"
        ports:
        - name: metrics
          containerPort: 9114
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-exporter-service
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: elasticsearch-exporter
    component: monitoring
spec:
  type: ClusterIP
  selector:
    app: elasticsearch-exporter
  ports:
  - name: metrics
    port: 9114
    targetPort: metrics
    protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: elasticsearch-exporter-monitor
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: elasticsearch-exporter
    component: monitoring
    prometheus: kube-prometheus
    release: prometheus-operator
spec:
  selector:
    matchLabels:
      app: elasticsearch-exporter
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: false
