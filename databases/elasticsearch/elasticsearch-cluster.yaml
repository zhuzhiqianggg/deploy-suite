apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: elasticsearch
  annotations:
    description: "Elasticsearch搜索引擎服务"
spec:
  serviceName: elasticsearch-headless
  replicas: 3
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        product: db
        version: lianantech
        branch: hk
        env: release
        app: elasticsearch
    spec:
      imagePullSecrets:
      
      - name: registry-secret
      
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: init-permissions
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          mkdir -p /usr/share/elasticsearch/data
          chown -R 1000:1000 /usr/share/elasticsearch/data
          chmod -R 755 /usr/share/elasticsearch/data
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: elasticsearch-data
          mountPath: /usr/share/elasticsearch/data
      # IK 中文分词插件：与 ES 严格同版本的插件整目录放在 NFS 共享存储
      # /data/nfs/{ns}/elasticsearch/plugins/analysis-ik/（由运维侧 unzip 预置，
      # 源: https://release.infinilabs.com/analysis-ik/stable/elasticsearch-analysis-ik-<版本>.zip），
      # 主容器只读挂载即可，ES 启动时扫描加载。多节点共享同一份，扩容/重建 Pod 无需节点预置，
      # 也不能用 elasticsearch-plugin install 装 zip（实测会丢 config/ 词典目录，首次分词 NPE）
      - name: install-ik-plugin
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          set -e
          test -f /es-plugins/analysis-ik/plugin-descriptor.properties
          test -f /es-plugins/analysis-ik/config/IKAnalyzer.cfg.xml
          echo "IK plugin on NFS verified"
        volumeMounts:
        - name: ik-plugin
          mountPath: /es-plugins
          readOnly: true
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
        # 用 ES_SETTING_ 前缀环境变量传 -E 参数（ES 7.x docker 镜像支持）。
        # 必须用 eswrapper 作为 args[0]，docker-entrypoint.sh 才会处理 ELASTIC_PASSWORD（写入 keystore）。
        # setting 名中的下划线用双下划线 __ 转义（如 self_generated → SELF__GENERATED）。
        env:
        - name: ES_JAVA_OPTS
          value: "-Xms31g -Xmx31g"
        - name: ELASTIC_USERNAME
          valueFrom:
            secretKeyRef:
              name: elasticsearch-secret
              key: username
        # ELASTIC_PASSWORD：首次启动时，docker-entrypoint.sh 会把它写入 elasticsearch.keystore 的
        # bootstrap.password，ES 启动后用该值初始化 elastic 用户密码。
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elasticsearch-secret
              key: password
        - name: ELASTICSEARCH_HOST
          value: "localhost"
        - name: ELASTICSEARCH_PORT
          value: "9200"
        - name: ES_SETTING_CLUSTER_NAME
          value: "es-cluster"
        - name: ES_SETTING_DISCOVERY_SEED__HOSTS
          value: "elasticsearch-0.elasticsearch-headless.db-lianantech-hk-release.svc.cluster.local,elasticsearch-1.elasticsearch-headless.db-lianantech-hk-release.svc.cluster.local,elasticsearch-2.elasticsearch-headless.db-lianantech-hk-release.svc.cluster.local"
        - name: ES_SETTING_CLUSTER_INITIAL__MASTER__NODES
          value: "elasticsearch-0,elasticsearch-1,elasticsearch-2"
        - name: ES_SETTING_XPACK_SECURITY_ENABLED
          value: "true"
        - name: ES_SETTING_XPACK_SECURITY_TRANSPORT_SSL_ENABLED
          value: "true"
        - name: ES_SETTING_XPACK_SECURITY_TRANSPORT_SSL_VERIFICATION__MODE
          value: "certificate"
        - name: ES_SETTING_XPACK_SECURITY_TRANSPORT_SSL_CLIENT__AUTHENTICATION
          value: "required"
        - name: ES_SETTING_XPACK_SECURITY_TRANSPORT_SSL_KEY
          value: "/usr/share/elasticsearch/config/transport-certs/tls.key"
        - name: ES_SETTING_XPACK_SECURITY_TRANSPORT_SSL_CERTIFICATE
          value: "/usr/share/elasticsearch/config/transport-certs/tls.crt"
        - name: ES_SETTING_XPACK_SECURITY_TRANSPORT_SSL_CERTIFICATE__AUTHORITIES
          value: "/usr/share/elasticsearch/config/transport-certs/tls.crt"
        # 强制 trial license：basic license 不会在首次启动时自动应用 ELASTIC_PASSWORD 初始化 elastic 用户密码
        - name: ES_SETTING_XPACK_LICENSE_SELF__GENERATED_TYPE
          value: "trial"
        - name: ES_SETTING_NETWORK_HOST
          value: "0.0.0.0"
        args:
        - "eswrapper"
        ports:
        - name: http
          containerPort: 9200
          protocol: TCP
        resources:
          requests:
            cpu: 2000m
            memory: 64Gi
          limits:
            cpu: 8000m
            memory: 64Gi
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 120
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 10
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        volumeMounts:
        - name: elasticsearch-data
          mountPath: /usr/share/elasticsearch/data
        
        - name: elasticsearch-transport-certs
          mountPath: /usr/share/elasticsearch/config/transport-certs
          readOnly: true

        # IK 插件目录（NFS 共享只读挂载，插件由运维预置到 /data/nfs/{ns}/elasticsearch/plugins/，
        # install-ik-plugin initContainer 启动前校验插件完整性）
        - name: ik-plugin
          mountPath: /usr/share/elasticsearch/plugins
          readOnly: true
        
      volumes:
      
      - name: elasticsearch-transport-certs
        secret:
          secretName: elasticsearch-transport-tls

      # IK 插件：NFS 共享存储（与数据 PVC 同一 NFS 服务），所有节点共用同一份插件，
      # 扩容新节点无需任何预置；升级插件只需替换 NFS 目录并重建 Pod
      - name: ik-plugin
        nfs:
          server: 173.23.1.2
          path: /data/nfs/db-lianantech-hk-release/elasticsearch/plugins
      
  volumeClaimTemplates:
  - metadata:
      name: elasticsearch-data
      labels:
        product: db
        version: lianantech
        branch: hk
        env: release
        app: elasticsearch
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 100Gi
      storageClassName: nfs-client
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: elasticsearch
spec:
  type: NodePort
  selector:
    app: elasticsearch
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: api
    port: 9200
    targetPort: http
    nodePort: 30464
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        product: db
        version: lianantech
        branch: hk
        env: release
        app: kibana
    spec:
      imagePullSecrets:
      
      - name: registry-secret
      
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:7.17.29
        ports:
        - name: http
          containerPort: 5601
          protocol: TCP
        env:
        - name: ELASTICSEARCH_HOSTS
          # ES 集群 http.ssl.enabled=false（明文 + 密码认证），必须是 http，用 https 会导致
          # ssl3_get_record:wrong version number 连接失败，进而 ruleRegistry 安装超时
          value: "http://elasticsearch-service.db-lianantech-hk-release.svc.cluster.local:9200"
        - name: ELASTICSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: elasticsearch-secret
              key: kibana_username
        # Kibana 7.17 的密码环境变量是 ELASTICSEARCH_PASSWORD（不是 ELASTIC_PASSWORD，
        # ELASTIC_PASSWORD 是 Elasticsearch 镜像的变量，Kibana 不会读它）。
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elasticsearch-secret
              key: kibana_password
        - name: XPACK_SECURITY_ENABLED
          value: "true"
        
        - name: ELASTICSEARCH_SSL_VERIFICATIONMODE
          value: "none"
        
        - name: ELASTICSEARCH_REQUESTTIMEOUT
          value: "300000"
        - name: ELASTICSEARCH_SHARDTIMEOUT
          value: "120000"
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 90
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: kibana-service
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: kibana
spec:
  type: NodePort
  selector:
    app: kibana
  ports:
  - name: http
    port: 5601
    targetPort: http
    protocol: TCP
    


