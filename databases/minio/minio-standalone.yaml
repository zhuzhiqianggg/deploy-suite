  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: minio
    type: database-secret
  annotations:
    description: "MinIO连接信息"
type: Opaque
data:
  host: bWluaW8tc2VydmljZS5kYi1saWFuYW50ZWNoLWhrLXJlbGVhc2Uuc3ZjLmNsdXN0ZXIubG9jYWw=
  port: OTAwMA==
  console_port: OTAwMQ==
  endpoint: aHR0cDovL21pbmlvLXNlcnZpY2UuZGItbGlhbmFudGVjaC1oay1yZWxlYXNlLnN2Yy5jbHVzdGVyLmxvY2FsOjkwMDA=
  console_url: aHR0cDovL21pbmlvLXNlcnZpY2UuZGItbGlhbmFudGVjaC1oay1yZWxlYXNlLnN2Yy5jbHVzdGVyLmxvY2FsOjkwMDE=
  root_user: bWluaW8tcm9vdA==
  root_password: VG41dkJxOHdYejJMbTZLZA==


---
# MinIO监控 - ServiceMonitor（内置 Prometheus 指标端点，无需独立 exporter 容器）
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: minio-monitor
  namespace: db-lianantech-hk-release
  labels:
    product: db
    version: lianantech
    branch: hk
    env: release
    app: minio
    component: monitoring
    prometheus: kube-prometheus
    release: prometheus-operator
spec:
  selector:
    matchLabels:
      app: minio
  endpoints:
  - port: api
    path: /minio/v2/metrics/cluster
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: false

