# ============================================================================
# Kubernetes 集群节点 NTP 时间同步配置 (chrony)
# ============================================================================
# 架构: 所有节点直连国内公共 NTP 源(不经过集群内中间节点)
#
# 为什么选"全节点直连"而不是"master01 做二级 NTP 服务器"?
#   1. 无单点: master01 重启/宕机时, 其余节点不受影响
#      (若经 master01 中转, 它故障期间漂移大的节点(实测 370ppm ≈ 32秒/天)
#       会持续偏离)
#   2. 所有节点本就有外网出口(原 ntp.ubuntu.com 就是直连), 直连无障碍
#   3. NTP 查询量极小: 每节点对每源约 1 个 UDP 包/分钟, 8 节点无压力
#   4. 节点间一致性: 对同一组上游同步, 互差通常 <10ms, 满足 k8s/etcd
#
# 背景(2026-08-20 排查结论): 原 systemd-timesyncd 同步 ntp.ubuntu.com(欧洲,
# RTT 230-355ms), 8 节点中 5 台偏差 0.5~3.5s 未被纠正; timesyncd 只能以
# ~500ppm 慢速追赶, 修 3 秒偏差需约 2 小时; 且对硬件时钟大漂移节点补偿不足。
#
# ⚠ 前置要求(必做!): 禁用 VMware Tools 时间同步, 否则与 chrony 拉锯:
#    vmware-toolbox-cmd timesync disable
#    (2026-08-20 实测: vmtools Enabled 时, chrony 步进后被 vmtoolsd 拉回
#     宿主机时间, 节点时钟反复跳变数百秒; ESXi 宿主机自身时钟需另行校准)
#
# 部署: cp chrony.conf /etc/chrony/chrony.conf && systemctl restart chrony
# 验证: chronyc sources 出现 ^* ; chronyc tracking 偏差 <100ms
# ============================================================================

# --- 上游 NTP 服务器(国内源, 多源互备, chrony 自动按 RTT/抖动择优) ---
server ntp.aliyun.com iburst
server ntp1.aliyun.com iburst
server ntp2.aliyun.com iburst
server ntp.tencent.com iburst

# --- 校正策略 ---
# 启动后前 3 次轮询中, 偏差 >1s 直接"步进"跳变校正(秒级止血, 处理存量偏差);
# 3 次之后只允许频率微调(平滑追赶), 避免业务运行中时间跳变
makestep 1.0 3

# 本机时钟频率漂移记录: chrony 据此持续补偿硬件时钟固有偏差
# (对漂移大的节点尤其关键, 如实测某节点 370ppm ≈ 每天漂 32 秒)
driftfile /var/lib/chrony/chrony.drift

# 同步系统时间到硬件时钟(RTC), 保证节点重启后时间不回退
rtcsync

# --- 运行参数 ---
# 本节点仅作 NTP 客户端(不配置 allow, 不对内网提供 NTP 服务)
logdir /var/log/chrony

# ============================================================================
# 备选架构: 集群内层级同步(仅当 worker 节点无外网时才需要, 当前不用)
#   master 节点 chrony.conf 追加(作为内网 NTP 服务端):
#     allow 192.168.10.0/24
#     local stratum 8        # 失联外网后仍以本地时钟对外供时
#   worker 节点上游改为(3 台 master 都配, 避免单点):
#     server 192.168.10.100 iburst    # master01
#     server 192.168.10.104 iburst    # master02
#     server 192.168.10.105 iburst    # master03
# ============================================================================
