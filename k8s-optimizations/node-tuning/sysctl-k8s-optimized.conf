# ============================================================================
# Kubernetes 内核参数优化配置
# ============================================================================
# 适用: 8C 30-32G 节点，运行 100+ Pod 的生产集群
# 部署: 复制到 /etc/sysctl.d/k8s-optimized.conf，执行 sysctl --system 生效
# ============================================================================

# --- 网络转发（必须） ---
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1
net.ipv4.ip_forward = 1

# --- ARP 缓存优化（大规模集群必须调高） ---
# 原默认 128/512/1024，节点 Pod 数多时 ARP 表溢出导致网络丢包
# 调高到 1024/2048/4096，覆盖 200+ Pod 节点
net.ipv4.neigh.default.gc_thresh1 = 1024
net.ipv4.neigh.default.gc_thresh2 = 2048
net.ipv4.neigh.default.gc_thresh3 = 4096

# --- conntrack 连接追踪 ---
# 原默认 262144，高并发场景连接追踪表满导致丢包
# 保持 262144（8C 节点够用，如需更高可调到 1048576）
net.netfilter.nf_conntrack_max = 262144
# conntrack 超时优化，减少无效连接占用
net.netfilter.nf_conntrack_tcp_timeout_established = 86400
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30

# --- TCP 优化 ---
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_max_tw_buckets = 131072
# TCP keepalive 优化，更快检测死连接
# 原默认 7200s(2h)/75s/9，改为 600s(10min)/30s/3
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 3

# --- 网络队列 ---
# 增大监听队列和网卡接收队列，提高高并发连接 accept 能力
net.core.somaxconn = 32768
net.core.netdev_max_backlog = 16384

# --- 文件描述符 ---
fs.file-max = 1048576
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# --- 进程数 ---
kernel.pid_max = 4194304

# --- 内存管理 ---
# swappiness=0: 尽量不使用 swap（k8s 禁止 swap）
vm.swappiness = 0
# overcommit_memory=1: 允许内存超分配（k8s Pod 经常 overcommit）
vm.overcommit_memory = 1
# panic_on_oom=0: OOM 时不 panic，由 OOM killer 处理
vm.panic_on_oom = 0
